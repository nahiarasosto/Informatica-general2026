<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Pupitres</title>
        <link rel="stylesheet" href="css/estilo.css">
    </head>
    <body>
        <header>
            <h1>Calculando pupitres</h1>
            <p>Ingresa todos los datos necesarios para calcular la cantidad de pupitres por aula (001, 101, 201, 301 y 501)</p>
        </header>
        <main>
            <div id="contenedor">
                <form action="#" method="get">
                    <input type="number" name="aula0" id="aula0" placeholder="Ingrese cantidad del aula 001">
                    <br>
                    <input type="number" name="aula1" id="aula1" placeholder="Ingrese cantidad del aula 101">
                    <br>
                    <input type="number" name="aula2" id="aula2" placeholder="Ingrese cantidad del aula 201">
                    <br>
                    <input type="number" name="aula3" id="aula3" placeholder="Ingrese cantidad del aula 301">
                    <br>
                    <input type="number" name="aula4" id="aula4" placeholder="Ingrese cantidad del aula 501">
                    <br>
                    <button type="button" id="calculo">Calcular</button>
                    <br>
                <div id="resultados">
                    
                </div>
                </form>
            </div>
        </main>
    <script src="js/script.js"></script>
    </body>
</html>
