<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Series</title>
        <link rel="stylesheet" href="css/estilo.css">
    </head>
    <body>
        <header>
            <h1>¡Te recomiendo una serie!</h1>
            <p>Ingresa en cada campo tu nombre, edad y género de series favorito (por ejemplo: suspenso, romance, comedia, etc)</p>
        </header>
        <main>
            <div id="contenedor">
                <form action="#" method="get">
                    <input type="text" name="nombre" id="nombre" placeholder="Ingresa tu nombre">
                    <br>
                    <input type="number" name="edadUsuario" id="edadUsuario" placeholder="Ingresa tu edad">
                    <br>
                    <input type="text" name="genero" id="genero" placeholder="Ingresa un género de serie">
                    <br>
                    <button type="button" id="calculo">¡Presiona para saber tu nueva serie favorita!</button>
                    <br>
                <div id="resultados">
                    
                </div>
                </form>
            </div>
        </main>
    <script src="js/script.js"></script>
    </body>
</html>
