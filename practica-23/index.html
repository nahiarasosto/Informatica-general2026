<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Pupitres</title>
        <link rel="stylesheet" href="css/estilo.css">
    </head>
    <body>
        <header>
            <h1>Calculando pupitres</h1>
            <p>Ingresa todos los datos necesarios para calcular la cantidad de pupitres por aula (001, 101, 201, 301 y 501)</p>
        </header>
        <main>
            <div id="contenedor">
                <form>
                    <input type="number" name="numPrecio" id="numPrecio" placeholder="Ingrese el precio">
                    <br>
                    <input type="number" name="numDescuento" id="numDescuento" placeholder="Ingrese el porcentaje de descuento">
                    <br>
                    <button type="button" name="calculo" id="calculo">Calcular</button>
                    <br>
                    <input type="number" name="resultado" id="resultado" placeholder="Aquí está el resultado!" disabled>
                </form>
            </div>
        </main>
    <script src="js/script.js"></script>
    </body>
</html>
